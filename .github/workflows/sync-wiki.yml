name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Publish canonical wiki source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Markdown to the repository Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout persists an authorization header for the primary repository.
          # Remove it before cloning so the URL below is the sole, explicit
          # credential and Git cannot silently fall back to the primary repo.
          git config --local --unset-all http.https://github.com/.extraheader || true
          WIKI_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          git clone --branch master "$WIKI_URL" wiki
          rsync -a --delete docs/wiki/ wiki/
          cd wiki
          git remote get-url origin | grep -q "${GITHUB_REPOSITORY}.wiki.git$" || {
            echo "Refusing to publish: origin is not this repository's Wiki." >&2
            exit 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "docs: sync wiki"
          git push origin HEAD:master
