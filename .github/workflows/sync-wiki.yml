name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/sync-wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Publish canonical wiki source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Sync Markdown to the repository Wiki
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          test -n "$WIKI_SYNC_TOKEN" || {
            echo "WIKI_SYNC_TOKEN is required to publish to the separate GitHub Wiki repository." >&2
            exit 1
          }
          WIKI_READ_URL="https://github.com/${GITHUB_REPOSITORY}.wiki.git"
          WIKI_PUSH_URL="https://x-access-token:${WIKI_SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git"
          echo "Expected Wiki remote: $WIKI_READ_URL"
          git clone --branch master "$WIKI_READ_URL" wiki
          rsync -a --delete docs/wiki/ wiki/
          cd wiki
          ACTUAL_REMOTE="$(git remote get-url origin)"
          echo "Cloned remote: $ACTUAL_REMOTE"
          printf '%s\n' "$ACTUAL_REMOTE" | grep -q "${GITHUB_REPOSITORY}.wiki.git$" || {
            echo "Refusing to publish: origin is not this repository's Wiki." >&2
            exit 1
          }
          git remote set-url --push origin "$WIKI_PUSH_URL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "docs: sync wiki"
          git push origin HEAD:master
