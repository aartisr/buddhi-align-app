name: CI/CD Quality Gates

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Only allow one concurrent run per branch; cancel older runs on new pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────
  # Primary quality gate: lint → type-check → test → build
  # ──────────────────────────────────────────────────────
  quality:
    name: Quality (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint:frontend

      - name: TypeScript type-check
        run: npm run typecheck
        continue-on-error: false

      - name: Test frontend
        run: npm run test:frontend

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify world-class checklist integrity
        run: npm run checklist:verify

  performance:
    name: Performance budgets (Lighthouse + CWV)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Enforce Lighthouse and Core Web Vitals budgets
        run: npm run perf:ci
        env:
          NEXT_TELEMETRY_DISABLED: 1

  accessibility:
    name: Accessibility baseline
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser checks
        run: npx --prefix apps/frontend playwright install --with-deps chromium

      - name: Verify public-route accessibility baseline
        run: npm run test:a11y
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify mobile PWA installability and offline fallback
        run: npm run test:pwa
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # Coverage is a release gate: regressions below configured thresholds block CI.
  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install pinned V8 coverage provider
        run: npm install --no-save --package-lock=false --workspace=apps/frontend @vitest/coverage-v8@3.2.4

      - name: Run tests with coverage
        run: npm --workspace=apps/frontend exec vitest run --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: apps/frontend/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ──────────────────────────────────────────────────────
  # Production dependency vulnerabilities at high or critical severity block CI.
  # ──────────────────────────────────────────────────────
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    needs: [quality, performance, accessibility, coverage, security-audit]
    if: always()
    steps:
      - name: Require every quality signal to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          ACCESSIBILITY: ${{ needs.accessibility.result }}
          COVERAGE: ${{ needs.coverage.result }}
          SECURITY: ${{ needs.security-audit.result }}
        run: |
          test "$QUALITY" = "success"
          test "$PERFORMANCE" = "success"
          test "$ACCESSIBILITY" = "success"
          test "$COVERAGE" = "success"
          test "$SECURITY" = "success"
