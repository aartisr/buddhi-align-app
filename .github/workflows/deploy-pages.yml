name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/github-pages/**"
      - "docs/wiki/**"
      - "scripts/build-github-pages-wiki.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble static documentation and wiki
        run: |
          mkdir -p .pages
          cp -R docs/github-pages/. .pages/
          node scripts/build-github-pages-wiki.mjs docs/wiki .pages/wiki
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - id: deployment
        uses: actions/deploy-pages@v4
