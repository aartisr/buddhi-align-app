name: Live discoverability validation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

jobs:
  validate:
    name: Validate canonical public discovery endpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Validate deployed SEO, GEO, AI, and PWA discovery signals
        run: npm run validate:live-discovery
        env:
          LIVE_SITE_URL: https://buddhi-align.foreverlotus.com
